name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:  # a new push to the same branch cancels the run in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # same as the local .venv
          cache: pip
      - run: pip install -r requirements.txt
      # no Ollama or Qdrant server needed: tests use in-memory Qdrant and fake embeddings
      - run: pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build  # tsc type check + vite build
